<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Home SOC and DFIR Lab Architecture</title>
  <desc id="desc">Windows 11 host running VMware Workstation Pro with WIN11-DFIR, Ubuntu-Splunk, and Kali Linux virtual machines. Sysmon and Windows Security logs are forwarded through Splunk Universal Forwarder over TCP 9997 to Splunk Enterprise.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
    <style>
      .title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}
      .heading{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}
      .label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#57606a}
      .host{fill:#f6f8fa;stroke:#8c959f;stroke-width:2}
      .vm{fill:#ffffff;stroke:#8c959f;stroke-width:2}
      .node{fill:#f6f8fa;stroke:#afb8c1;stroke-width:1.5}
      .line{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:6 6;fill:none}
    </style>
  </defs>

  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">Home SOC &amp; DFIR Lab Architecture</text>

  <rect x="35" y="70" width="1330" height="450" rx="14" class="host"/>
  <text x="60" y="103" class="heading">Windows 11 Host — VMware Workstation Pro</text>

  <!-- Windows VM -->
  <rect x="70" y="135" width="400" height="335" rx="12" class="vm"/>
  <text x="270" y="170" text-anchor="middle" class="heading">WIN11-DFIR</text>

  <rect x="105" y="200" width="150" height="58" rx="8" class="node"/>
  <text x="180" y="234" text-anchor="middle" class="label">Sysmon</text>

  <rect x="285" y="200" width="150" height="58" rx="8" class="node"/>
  <text x="360" y="225" text-anchor="middle" class="label">Windows</text>
  <text x="360" y="244" text-anchor="middle" class="small">Security Logs</text>

  <rect x="175" y="300" width="190" height="66" rx="8" class="node"/>
  <text x="270" y="326" text-anchor="middle" class="label">Splunk Universal</text>
  <text x="270" y="347" text-anchor="middle" class="label">Forwarder</text>

  <rect x="175" y="395" width="190" height="52" rx="8" class="node"/>
  <text x="270" y="427" text-anchor="middle" class="label">DFIR Toolset</text>

  <path d="M180 258 L235 300" class="line"/>
  <path d="M360 258 L305 300" class="line"/>

  <!-- Splunk VM -->
  <rect x="520" y="135" width="420" height="335" rx="12" class="vm"/>
  <text x="730" y="170" text-anchor="middle" class="heading">Ubuntu-Splunk</text>

  <rect x="635" y="205" width="190" height="60" rx="8" class="node"/>
  <text x="730" y="241" text-anchor="middle" class="label">Splunk Enterprise</text>

  <rect x="635" y="305" width="190" height="60" rx="8" class="node"/>
  <text x="730" y="341" text-anchor="middle" class="label">Search &amp; Analysis</text>

  <rect x="625" y="405" width="210" height="60" rx="8" class="node"/>
  <text x="730" y="430" text-anchor="middle" class="label">Scheduled Detections</text>
  <text x="730" y="450" text-anchor="middle" class="label">&amp; Alerts</text>

  <path d="M730 265 L730 305" class="line"/>
  <path d="M730 365 L730 405" class="line"/>

  <!-- Kali VM -->
  <rect x="990" y="135" width="335" height="335" rx="12" class="vm"/>
  <text x="1157.5" y="170" text-anchor="middle" class="heading">Kali Linux</text>

  <rect x="1062" y="230" width="190" height="62" rx="8" class="node"/>
  <text x="1157" y="267" text-anchor="middle" class="label">Security Testing</text>

  <rect x="1062" y="335" width="190" height="62" rx="8" class="node"/>
  <text x="1157" y="372" text-anchor="middle" class="label">Network Analysis</text>

  <!-- Forwarding path -->
  <path d="M365 333 C430 333 470 235 635 235" class="line"/>
  <rect x="447" y="250" width="88" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="491" y="269" text-anchor="middle" class="small">TCP 9997</text>

  <!-- Kali future relationship -->
  <path d="M990 420 C960 420 960 420 940 420" class="dash"/>
  <text x="965" y="444" text-anchor="middle" class="small">future controlled testing</text>
</svg>
